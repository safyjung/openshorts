services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app:Z
      - /app/__pycache__
      - openshorts_uploads:/app/uploads
      - openshorts_output:/app/output
      - openshorts_cache:/app/.cache
    environment:
      - MPLCONFIGDIR=/tmp/matplotlib
      - YOLO_MODEL_PATH=/tmp/yolov8n.pt
      - HOOK_TEMP_DIR=/tmp
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app:Z
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - openshorts_output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  openshorts_uploads:
  openshorts_output:
  openshorts_cache:
